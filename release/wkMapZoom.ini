; wkMapZoom settings (all optional). Delete a line to use its default.
[wkMapZoom]
; How far out you can zoom: 4 = 25% (four times the map width and height), up to 8 = 12.5%.
MaxOut=4
; How far in you can zoom: 8 = 800%.
MaxIn=8
; Zoom per wheel notch (and per numpad + / - press).
Step=1.15
; 1 = glide to the new zoom, 0 = jump.
Smooth=1
; How the zoomed map is drawn: smooth = each screen pixel is the average of the map pixels it covers (thin lines
; stay visible zoomed out, pixels stay even zoomed in); nearest = plain pixel picking.
Filter=smooth
; The zoom readout (the zoom as a number, e.g. 150%): zooming = shown while you zoom, then fades;
; always = also stays (dim) while not at 100%; off = never.
Indicator=zooming
; Where: top-right, top-left, top, bottom-right, bottom-left or bottom.
IndicatorPlace=top-right
; 1 = numpad + / - zoom too, numpad * goes back to 100% (0 = the numpad is left to WA).
NumpadKeys=1
; The auto zoom: 1 = the map zooms on its own to fit the space around your worm: out where it opens up (already as you
; head into the open), in where it is tight (a time trial map), your own zoom in an ordinary map. Slowly; never further
; out than where the whole level fits the screen; never moves the camera. The wheel still works (your zoom is its base).
; Ctrl + A and the Esc menu (Map zoom options) switch it, and save it here. 0 = off.
AutoZoom=0
; The furthest the auto zoom goes out: 0.35 = 35% (1 = it never zooms out).
AutoZoomMin=0.35
; The furthest the auto zoom goes in: 1.5 = 150% (1 = it never zooms in).
AutoZoomMax=1.5
; The movement line: when your turn starts, a red line shows where this worm has been (all = the whole game, its last turn
; bright; last = its last turn only; off = no line). Teleports break the line.
TurnLine=all
; 0 = the movement line goes as soon as the worm moves; 1 = it stays all turn.
TurnLineKeep=0
; 1 = show the zoomed map in true colour (WA's renderer on one of its Direct3D 9 options); 0 = WA's 256 colours.
TrueColour=1
; 1 = full-colour PNG / JPEG maps in User\SavedLevels: WA gets a 64-colour copy it can load, and you see the map's own
; colours (true colour needed) where the land hasn't been blown up. Other players see WA's copy.
ColourMaps=1
; The WA theme full-colour maps get (the soil behind craters, the backdrop): Forest, Art, Cheese, Construction,
; Desert, Dungeon, Easter, Fruit, Gulf, Hell, Hospital, Jungle, Manhattan, Medieval, Music, Pirate, Snow, Space,
; Sports, Tentacle, Time, Tools, Tribal, Urban, -Beach, -Desert, -Farm, -Forest, -Hell.
MapTheme=Forest
; 1 = a Resolution list and a Fullscreen / Windowed switch in WA's Esc menu (applied at once; the resolution is kept
; as WA's own setting); 0 = WA's Esc menu as it is.
EscMenu=1

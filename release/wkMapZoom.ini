; wkMapZoom settings (all optional). Delete a line to use its default.
[wkMapZoom]
; How far out you can zoom: 4 = 25% (four times the map width and height), up to 8 = 12.5%.
MaxOut=4
; How far in you can zoom: 8 = 800%.
MaxIn=8
; Zoom per wheel notch (and per numpad + / - press).
Step=1.15
; 1 = glide to the new zoom, 0 = jump.
Smooth=1
; How the zoomed map is drawn: smooth = each screen pixel is the average of the map pixels it covers (thin lines
; stay visible zoomed out, pixels stay even zoomed in); nearest = plain pixel picking.
Filter=smooth
; The zoom readout (the zoom as a number, e.g. 150%): zooming = shown while you zoom, then fades;
; always = also stays (dim) while not at the default zoom; off = never.
Indicator=zooming
; Where: top-right, top-left, top, bottom-right, bottom-left or bottom.
IndicatorPlace=top-right
; 1 = numpad + / - zoom too, numpad * goes back to the default zoom (0 = the numpad is left to WA).
NumpadKeys=1
; The zoom each game starts at, and that Ctrl + middle click and numpad * go back to: 1 = 100%, 0.7 = 70%, 1.5 = 150%.
; The Esc menu (Map zoom options > Default zoom) sets it too.
DefaultZoom=1
; The auto zoom: 1 = the map zooms on its own to fit the space around your worm: out where it opens up (already as you
; head into the open, or fall fast), in where it is tight (a time trial map), your
; own zoom in an ordinary map. Slowly; never further out than where the whole level fits the screen; never moves the
; camera. The wheel still works (your zoom is its base).
; Ctrl + A and the Esc menu (Map zoom options) switch it, and save it here. 0 = off.
AutoZoom=0
; The furthest the auto zoom (and the speed zoom) goes out, as a share of your own zoom: 0.35 = 35% at 100% (1 = it
; never zooms out).
AutoZoomMin=0.35
; The furthest the auto zoom goes in: 1.5 = 150% (1 = it never zooms in).
AutoZoomMax=1.5
; Falling at least this fast (pixels a second, downward), the auto zoom zooms out to keep the ground below on screen
; (0 = always; above 1600, WA's fastest fall, = never).
AutoZoomFallSpeed=1000
; The speed zoom: 1 = past a speed the map zooms out, more the faster your worm goes (on its own or with the auto
; zoom; never further out than AutoZoomMin). The Esc menu switches it. 0 = off.
SpeedZoom=0
; The speed it starts at, in pixels a second (the speedometer turns red there).
SpeedZoomFrom=800
; How strong: the zoom times this for every 500 px/s over the start (0.7 from 800: x0.7 at 1300 px/s, x0.49 at 1800).
SpeedZoomStrength=0.7
; The speedometer (the speed of the worm whose turn it is, in pixels a second): dial, number or off. WA's top speed is 2263 px/s
; (diagonally; 1600 px/s straight down).
Speedometer=dial
; Where: corner (bottom right, above WA's wind bar) or worm (just above your worm's name).
SpeedometerPlace=corner
; The movement line: when your turn starts, a line shows where this worm has been (all = the whole game, its last turn
; bright; last = its last turn only; off = no line). Teleports break the line.
TurnLine=all
; 0 = the movement line goes as soon as the worm moves; 1 = it stays all turn.
TurnLineKeep=0
; The movement line's colour: speed = how fast the worm went there, as the speedometer shows it (blue slow, red from
; SpeedZoomFrom on); red = all red.
TurnLineColour=speed
; 1 = show the zoomed map in true colour (WA's renderer on one of its Direct3D 9 options); 0 = WA's 256 colours.
TrueColour=1
; 1 = full-colour PNG / JPEG maps in User\SavedLevels: WA gets a 64-colour copy it can load, and you see the map's own
; colours (true colour needed) where the land hasn't been blown up. Other players see WA's copy.
ColourMaps=1
; The WA theme full-colour maps get (the soil behind craters, the backdrop): Forest, Art, Cheese, Construction,
; Desert, Dungeon, Easter, Fruit, Gulf, Hell, Hospital, Jungle, Manhattan, Medieval, Music, Pirate, Snow, Space,
; Sports, Tentacle, Time, Tools, Tribal, Urban, -Beach, -Desert, -Farm, -Forest, -Hell.
MapTheme=Forest
; 1 = a Resolution list, a Fullscreen / Windowed switch and Map zoom options in WA's Esc menu (applied at once; the
; resolution is kept as WA's own setting); 0 = WA's Esc menu as it is (no Map zoom options either).
EscMenu=1

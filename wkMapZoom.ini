; wkMapZoom settings (all optional). Delete a line to use its default.
; WA's Graphics API has to be Direct3D 9 (shader) (Options > Advanced): on the others the map stays at 100%.
; With wkModMenu (github.com/GermsWorms/wkModMenu) all of this can be changed in the game: Esc, Mods.
[wkMapZoom]
; 1 = the graphics card draws the game's picture (the zoom needs it, and the game draws faster at 100% too).
; 0 = WA draws by itself, as without the module: no zoom.
GraphicsCard=1
; How far out you can zoom: 4 = 25% (four times the map width and height), up to 8 = 12.5% (if the graphics card can
; make a map that big; if not, the zoom goes less far out and the log says so).
MaxOut=4
; How far in you can zoom: 8 = 800%.
MaxIn=8
; Zoom per wheel notch (and per numpad + / - press).
Step=1.15
; 1 = glide to the new zoom, 0 = jump.
Smooth=1
; How the zoomed map is drawn: smooth = each screen pixel is the average of the map pixels it covers (thin lines
; stay visible zoomed out, pixels stay even zoomed in); nearest = plain pixel picking.
Filter=smooth
; The zoom readout (the zoom as a number, e.g. 150%): zooming = shown while you zoom, then fades;
; always = also stays (dim) while not at the default zoom; off = never.
Indicator=zooming
; Where: top-right, top-left, top, bottom-right, bottom-left or bottom.
IndicatorPlace=top-right
; The key held with the wheel (and the middle click): ctrl, alt or shift.
ZoomModifier=ctrl
; Keys that zoom in and out one step, and one that goes back to the default zoom. A key is written as A, Ctrl+A,
; Alt+F6, Shift+PageUp, Numpad 5, Space, Key 220 (a virtual-key number) or none.
ZoomInKey=Numpad +
ZoomOutKey=Numpad -
ZoomResetKey=Numpad *
; The zoom each game starts at, and that Ctrl + middle click and numpad * go back to: 1 = 100%, 0.7 = 70%, 1.5 = 150%.
DefaultZoom=1
; The auto zoom: 1 = the map zooms on its own to fit the space around your worm: out where it opens up (already as you
; head into the open, or fall fast), in where it is tight (a time trial map), your
; own zoom in an ordinary map. Slowly; never further out than where the whole level fits the screen; never moves the
; camera. The wheel still works (your zoom is its base).
; Its key (AutoZoomKey) switches it, and saves it here. 0 = off.
AutoZoom=0
; The key that switches the auto zoom.
AutoZoomKey=Ctrl+A
; The furthest the auto zoom (and the speed zoom) goes out, as a share of your own zoom: 0.35 = 35% at 100% (1 = it
; never zooms out).
AutoZoomMin=0.35
; The furthest the auto zoom goes in: 1.5 = 150% (1 = it never zooms in).
AutoZoomMax=1.5
; Falling at least this fast (pixels a second, downward), the auto zoom zooms out to keep the ground below on screen
; (0 = always; above 1600, WA's fastest fall, = never).
AutoZoomFallSpeed=1000
; The speed zoom: 1 = past a speed the map zooms out, more the faster your worm goes (on its own or with the auto
; zoom; never further out than AutoZoomMin). 0 = off.
SpeedZoom=0
; The speed it starts at, in pixels a second.
SpeedZoomFrom=800
; How strong: the zoom times this for every 500 px/s over the start (0.7 from 800: x0.7 at 1300 px/s, x0.49 at 1800).
SpeedZoomStrength=0.7
